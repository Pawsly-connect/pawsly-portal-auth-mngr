name: Deploy PROD

on:
  push:
    branches:
      - master

jobs:
    deploy-prod:
        uses: Pawsly-connect/pawsly-pipeline/.github/workflows/deploy_backend.yml@feature/add_pipeline
        with:
            environment: pr
            node-version: 20.x
            build-command: npm run build
            function-name: lbda-prod-portal-auth-mngr
            files-to-compress: "build node_modules statics"
        secrets:
            AWS_ROLE_DEPLOY_BACKEND: ${{ secrets.AWS_ROLE_DEPLOY_BACKEND }}
            ENV_VARS: >
              DYNAMO_ENDPOINT=${{ secrets.DYNAMO_ENDPOINT }}
              EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
              EMAIL_USER=${{ secrets.EMAIL_USER }}
              KEY_AES=${{ secrets.KEY_AES }}
              KEY_IV=${{ secrets.KEY_IV }}
              REGION_AWS_LAMBDA=${{ secrets.REGION_AWS_LAMBDA }}
              EMAIL_HOST=${{ secrets.EMAIL_HOST }}
              EMAIL_PORT=${{ secrets.EMAIL_PORT }}
              HOST_FRONT=${{ secrets.HOST_FRONT }}
              NODE_ENV=${{ secrets.NODE_ENV }}
