name: Deploy STG

on:
  push:
    branches:
      - staging

jobs:
  deploy-stg:
    uses: Pawsly-connect/pawsly-pipeline/.github/workflows/deploy_backend.yml@feature/add_pipeline
    with:
      environment: st
      node-version: 20.x
      build-command: npm run build
      function-name: lbda-stg-portal-auth-mngr
      files-to-compress: "build node_modules statics"
    secrets:
      AWS_ROLE_DEPLOY_BACKEND: ${{ secrets.AWS_ROLE_DEPLOY_BACKEND }}
      ENV_VARS: >
        REGION=${{ secrets.REGION }}
        EMAIL_HOST=${{ secrets.EMAIL_HOST }}
        EMAIL_PORT=${{ secrets.EMAIL_PORT }}
        HOST_FRONT=${{ secrets.HOST_FRONT }}
        CIPHER_METHOD=${{ secrets.CIPHER_METHOD }}
        HASH_METHOD=${{ secrets.HASH_METHOD }}
        ENCRPYT_METHOD=${{ secrets.ENCRPYT_METHOD }}
        NODE_ENV=staging
        DEBUG=paw:*
